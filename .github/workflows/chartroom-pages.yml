# Builds and publishes the Chartroom site (chartroom/) to GitHub Pages.
# One-time setup in the repository: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# It runs on pushes to main that touch chartroom/, and can be started by hand from the Actions tab.
name: Chartroom site

on:
  push:
    branches: [main]
    paths: ["chartroom/**", ".github/workflows/chartroom-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: chartroom

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chartroom/package-lock.json
      - run: npm ci
      - name: Build and check
        env:
          # A project site is served from /<repo-name>/. Only the 404 page needs to know this.
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: chartroom/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
